version: '3.8'

services:
  mysql-db:
    image: mysql:latest
    container_name: taller_db_container
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taller_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    container_name: taller_api_container
    ports:
      - "8000:8000"
    depends_on:
      - mysql-db

volumes:
  mysql_data: